<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker — Minimalist Task Management</title>
  <link rel="stylesheet" href="style.css?v=2.3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Sleek Minimal Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">Tasks</h1>
          <span class="live-date" id="liveDateDisplay"></span>
        </div>
      </div>

      <div class="header-actions">
        <button class="btn btn-ghost btn-sm" id="btnExportJson" title="Export tasks to JSON">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Export</span>
        </button>

        <button class="btn btn-ghost btn-sm" id="btnResetDemo" title="Clear all tasks">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>Clear All</span>
        </button>

        <button class="btn btn-primary btn-sm" id="btnOpenAddModal">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>New Task</span>
        </button>
      </div>
    </header>

    <!-- Minimalist Stats Strip -->
    <section class="stats-strip">
      <div class="stat-card">
        <span class="stat-label">Total Tasks</span>
        <div class="stat-value-wrap">
          <span class="stat-value" id="summaryTotalTasks">0</span>
        </div>
      </div>

      <div class="stat-card">
        <span class="stat-label">Due Today</span>
        <div class="stat-value-wrap">
          <span class="stat-value" id="kpiTasksDueToday">0</span>
        </div>
      </div>

      <div class="stat-card">
        <span class="stat-label">In Progress</span>
        <div class="stat-value-wrap">
          <span class="stat-value" id="summaryInProgress">0</span>
        </div>
      </div>

      <div class="stat-card">
        <span class="stat-label">Overdue</span>
        <div class="stat-value-wrap">
          <span class="stat-value text-danger" id="kpiOverdue">0</span>
        </div>
      </div>

      <div class="stat-card stat-completion">
        <span class="stat-label">Completion Rate</span>
        <div class="stat-value-wrap">
          <span class="stat-value" id="kpiCompletionRate">0%</span>
          <span class="stat-subtext"><span id="summaryCompleted">0</span> completed</span>
        </div>
        <!-- Hidden elements for app.js backwards-compatibility -->
        <span id="kpiCompletedThisWeek" style="display:none;"></span>
      </div>
    </section>

    <!-- Priority Breakdown (Minimal Inline Bar & Canvas) -->
    <section class="priority-overview-card">
      <div class="priority-overview-left">
        <span class="overview-title">Priority Breakdown</span>
        <div class="priority-chips">
          <div class="priority-chip chip-high">
            <span class="chip-dot"></span>
            <span class="chip-name">High</span>
            <span class="chip-pct" id="legendHighPct">0%</span>
          </div>
          <div class="priority-chip chip-medium">
            <span class="chip-dot"></span>
            <span class="chip-name">Medium</span>
            <span class="chip-pct" id="legendMedPct">0%</span>
          </div>
          <div class="priority-chip chip-low">
            <span class="chip-dot"></span>
            <span class="chip-name">Low</span>
            <span class="chip-pct" id="legendLowPct">0%</span>
          </div>
          <span class="legend-total" id="legendTotalTasks" style="display: none;"></span>
        </div>
      </div>

      <div class="priority-chart-wrapper">
        <canvas id="priorityChart" width="100" height="100"></canvas>
      </div>
    </section>

    <!-- Controls Toolbar & Segmented View Tabs -->
    <section class="toolbar-section">
      <nav class="segmented-tabs" id="viewTabsContainer" aria-label="Task filters">
        <button class="tab-btn active" data-tab="all">All</button>
        <button class="tab-btn" data-tab="today">Today</button>
        <button class="tab-btn" data-tab="this-week">This Week</button>
        <button class="tab-btn" data-tab="in-progress">In Progress</button>
        <button class="tab-btn" data-tab="completed">Completed</button>
        <button class="tab-btn" data-tab="overdue">Overdue</button>
      </nav>

      <div class="filter-controls">
        <div class="search-input-wrap">
          <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="taskSearchInput" placeholder="Filter tasks..." autocomplete="off">
        </div>

        <select id="priorityFilterSelect" class="select-input" title="Filter by priority">
          <option value="ALL">All Priorities</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>

        <span class="filtered-badge" id="filteredCountBadge">0 tasks</span>
      </div>
    </section>

    <!-- Bulk Actions Floating Bar (Active when items are selected) -->
    <div class="bulk-actions-bar" id="bulkActionsBar">
      <span class="bulk-count" id="selectedCountText">0 selected</span>
      <div class="bulk-buttons">
        <button class="btn btn-sm btn-outline" id="btnBulkComplete">Mark as Done</button>
        <button class="btn btn-sm btn-danger" id="btnBulkDelete">Delete</button>
        <button class="btn btn-sm btn-ghost" id="btnBulkCancel">Cancel</button>
      </div>
    </div>

    <!-- Minimalist Tasks Table -->
    <main class="table-card">
      <div class="table-responsive">
        <table class="task-table" id="taskTable">
          <thead>
            <tr>
              <th class="th-checkbox">
                <input type="checkbox" id="selectAllCheckbox" aria-label="Select all tasks">
              </th>
              <th class="th-task sortable" data-sort="title">
                <div class="th-content">
                  <span>Task</span>
                  <svg class="sort-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg>
                </div>
              </th>
              <th class="th-priority sortable" data-sort="priority">
                <div class="th-content">
                  <span>Priority</span>
                  <svg class="sort-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg>
                </div>
              </th>
              <th class="th-date sortable" data-sort="dueDate">
                <div class="th-content">
                  <span>Due Date</span>
                  <svg class="sort-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg>
                </div>
              </th>
              <th class="th-status sortable" data-sort="completed">
                <div class="th-content">
                  <span>Status</span>
                  <svg class="sort-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg>
                </div>
              </th>
              <th class="th-actions">Actions</th>
            </tr>
          </thead>
          <tbody id="taskTableBody">
            <!-- Dynamically populated via JS -->
          </tbody>
        </table>

        <!-- Clean Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
          <div class="empty-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          </div>
          <p class="empty-text">No tasks yet. Create your first task to get started!</p>
          <button class="btn btn-sm btn-primary" id="btnEmptyAdd">Create New Task</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Minimalist Add/Edit Task Modal -->
  <div class="modal-backdrop" id="taskModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">New Task</h3>
        <button class="btn-close" id="btnModalClose" aria-label="Close dialog">&times;</button>
      </div>

      <form id="taskForm">
        <input type="hidden" id="editTaskId">

        <div class="form-group">
          <label for="taskTitleInput">Task Description</label>
          <input type="text" id="taskTitleInput" placeholder="What needs to be done?" required autofocus>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="taskPriorityInput">Priority</label>
            <select id="taskPriorityInput" class="select-input">
              <option value="High">High</option>
              <option value="Medium" selected>Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>

          <div class="form-group">
            <label for="taskDueDateInput">Due Date</label>
            <input type="date" id="taskDueDateInput" class="date-input" required>
          </div>
        </div>

        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="taskStatusInput">
            <span>Mark as Completed</span>
          </label>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="btnModalCancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btnModalSubmit">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Fallback button for cached JS scripts -->
  <button id="btnQuickAddTab" style="display:none;" aria-hidden="true"></button>

  <script src="app.js?v=2.3"></script>
</body>
</html>
